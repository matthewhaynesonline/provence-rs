[package]
name = "provence-rs"
version = "0.1.0"
edition = "2024"
description = "Rust inference implementation of the Provence Reranker model."
repository = "https://github.com/matthewhaynesonline/provence-rs"
keywords = ["tensor", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"
readme = "README.md"

[workspace]
members = [".", "candle_shims"]

[workspace.dependencies]
# accelerate-src = "0.3.2"
candle-core = { git = "https://github.com/huggingface/candle.git", version = "0.9.2-alpha.1" }
candle-flash-attn = { git = "https://github.com/huggingface/candle.git", version = "0.9.2-alpha.1" }
candle-nn = { git = "https://github.com/huggingface/candle.git", version = "0.9.2-alpha.1" }
candle-transformers = { git = "https://github.com/huggingface/candle.git", version = "0.9.2-alpha.1" }
either = "1.15.0"
hf-hub = "0.4.1"
# punkt = { version = "1.0.4" }
# https://github.com/ferristseng/rust-punkt/pull/18
punkt = { git = "https://github.com/darjus/rust-punkt.git", rev = "39ed566" }
tokenizers = "0.21.0"

# Local deps
candle_shims = { path = "candle_shims" }

[workspace.lints]
rust.unsafe_code = "deny"
# rust.warnings = "deny"
# rust.missing_docs = "deny"
# rust.missing_debug_implementations = "deny"

clippy.unwrap_used = "deny"
clippy.expect_used = "deny"
clippy.panic = "deny"
clippy.todo = "deny"
# clippy.dbg_macro = "deny"
clippy.unimplemented = "deny"
clippy.indexing_slicing = "deny"
clippy.unwrap_or_default = "deny"

# optional stricter groups
# clippy.pedantic = "deny"
# clippy.nursery = "deny"

[dependencies]
# accelerate-src = { workspace = true, optional = true }
candle-core = { workspace = true }
candle-flash-attn = { workspace = true, optional = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
candle_shims = { workspace = true }
either = { workspace = true }
hf-hub = { workspace = true }
punkt = { workspace = true, optional = true }
tokenizers = { workspace = true }

[dev-dependencies]
anyhow = "1.0"
clap = { version = "4.5.53", features = ["derive"] }
console = "0.16.1"
serde = { version = "1.0.171", features = ["derive"] }
serde_json = "1.0.99"
similar = { version = "2.7.0", features = ["inline"] }

[lints]
workspace = true

[features]
default = ["provence-process", "punkt"]
# accelerate = [
#   "dep:accelerate-src",
#   "candle-core/accelerate",
#   "candle-nn/accelerate",
#   "candle-transformers/accelerate",
# ]
cuda = [
  "candle-core/cuda",
  "candle-core/cudnn",
  "candle-transformers/cuda",
  "candle-transformers/flash-attn",
]
cudnn = ["candle-core/cudnn", "candle-nn/cudnn", "candle-transformers/cudnn"]
flash-attn = ["cuda", "candle-transformers/flash-attn", "dep:candle-flash-attn"]
# mkl = [
#   "dep:intel-mkl-src",
#   "candle-core/mkl",
#   "candle-nn/mkl",
#   "candle-transformers/mkl",
# ]
# nccl = ["cuda", "cudarc/nccl", "dep:half"]
metal = ["candle-core/metal", "candle-nn/metal"]
provence-process = []
punkt = ["dep:punkt"]

# [[example]]
# name = "bert"
# path = "examples/bert/main.rs"
